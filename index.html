<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Проверьте, сможете ли вы отличить фотографию от изображения, созданного ИИ.">
  <title>Визуальный тест Тьюринга</title>
  <style>
    :root { --ink:#090909; --paper:#fff; --line:2px solid var(--ink); --muted:#6d6d6d; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:Arial, Helvetica, sans-serif; }
    button { font:inherit; }
    .site-header { border-bottom:var(--line); padding:18px max(18px, calc((100vw - 1120px)/2)); }
    .header-row { max-width:1120px; margin:auto; display:flex; align-items:flex-start; justify-content:space-between; gap:22px; }
    .eyebrow, .serial, .choice-label, .result-label, .site-footer { font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
    h1, h2, p { margin:0; }
    h1 { max-width:780px; font-size:clamp(42px, 9vw, 108px); line-height:.78; letter-spacing:-.09em; text-transform:uppercase; }
    .intro { max-width:1120px; margin:0 auto; padding:clamp(48px, 9vw, 112px) 18px 52px; }
    .intro p { max-width:570px; margin-top:26px; font-size:clamp(18px, 2.6vw, 28px); line-height:1.12; font-weight:700; }
    .jump-links { display:flex; flex-wrap:wrap; gap:7px; justify-content:flex-end; }
    .jump-links a { color:inherit; border:var(--line); padding:7px 9px; text-decoration:none; font-size:12px; font-weight:800; text-transform:uppercase; }
    .jump-links a:hover, .jump-links a:focus-visible { color:var(--paper); background:var(--ink); outline:none; }
    main { border-top:var(--line); }
    .poll { --accent:#ff2727; scroll-margin-top:18px; border-bottom:var(--line); }
    .poll-inner { max-width:1120px; margin:auto; padding:clamp(34px, 6vw, 72px) 18px; }
    .poll-heading { display:grid; grid-template-columns:112px 1fr; gap:16px; align-items:start; margin-bottom:26px; }
    .serial { color:var(--accent); padding-top:9px; }
    h2 { font-size:clamp(54px, 10vw, 130px); line-height:.74; letter-spacing:-.1em; text-transform:uppercase; }
    .question { margin-top:17px; max-width:530px; font-size:clamp(19px, 2.7vw, 30px); font-weight:800; line-height:1.05; }
    .choices { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:12px; }
    .choice { min-width:0; overflow:hidden; padding:0; border:var(--line); background:var(--paper); color:var(--ink); cursor:pointer; text-align:left; transition:transform .16s ease, box-shadow .16s ease, background .16s ease; }
    .choice:not(:disabled):hover, .choice:not(:disabled):focus-visible { transform:translate(-5px,-5px); box-shadow:6px 6px 0 var(--accent); outline:none; }
    .choice:disabled { cursor:not-allowed; opacity:.62; }
    .choice img { display:block; width:100%; aspect-ratio:4/3; object-fit:contain; object-position:center; background:#fff; border-bottom:var(--line); }
    .choice-label { display:flex; justify-content:space-between; padding:13px 14px 14px; font-size:clamp(15px, 2vw, 20px); }
    .choice-label span:last-child { color:var(--accent); }
    .vote-note { min-height:20px; margin-top:13px; color:var(--muted); font-size:13px; line-height:1.25; }
    .result { display:none; border:var(--line); padding:clamp(20px, 4vw, 38px); background:var(--paper); }
    .poll[data-state="result"] .choices, .poll[data-state="result"] .vote-note { display:none; }
    .poll[data-state="result"] .result { display:block; }
    .result-grid { display:grid; grid-template-columns:1fr minmax(210px, 1.1fr); gap:36px; align-items:start; }
    .result-title { margin-top:10px; font-size:clamp(28px, 4vw, 54px); line-height:.9; letter-spacing:-.06em; text-transform:uppercase; }
    .result-title strong { color:var(--accent); }
    .result-note { margin-top:17px; max-width:380px; font-size:16px; line-height:1.22; }
    .stats { display:grid; gap:16px; }
    .stat-line { display:grid; grid-template-columns:24px 1fr auto; align-items:center; gap:10px; font-size:15px; font-weight:800; }
    .bar { height:16px; overflow:hidden; border:var(--line); background:#fff; }
    .bar > i { display:block; height:100%; background:var(--accent); transition:width .3s ease; }
    .stat-total { margin-top:2px; color:var(--muted); font-size:13px; line-height:1.25; }
    .status { max-width:1120px; min-height:0; margin:0 auto; padding:0 18px; color:#b10000; font-size:13px; line-height:1.35; }
    .status:empty { display:none; }
    .site-footer { max-width:1120px; margin:auto; padding:26px 18px 34px; display:flex; justify-content:space-between; gap:20px; color:var(--muted); }
    @media (max-width:620px) {
      .site-header { padding-top:13px; padding-bottom:13px; }
      .header-row { display:block; }
      .jump-links { justify-content:flex-start; margin-top:14px; }
      .intro { padding-top:46px; }
      .poll-heading { display:block; }
      .serial { padding:0 0 13px; }
      .result-grid { grid-template-columns:1fr; gap:29px; }
      .site-footer { display:block; }
      .site-footer span:last-child { display:block; margin-top:9px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-row">
      <span class="eyebrow">Визуальный тест Тьюринга</span>
      <nav class="jump-links" aria-label="Опросы">
        <a href="#grach">Грач</a><a href="#volk">Волк</a><a href="#osetr">Осётр</a>
      </nav>
    </div>
  </header>

  <section class="intro" aria-labelledby="page-title">
    <h1 id="page-title">КАКОЙ ИЗ НИХ<br>НАСТОЯЩИЙ?</h1>
    <p>В каждой паре одно изображение создано искусственным интеллектом. Выберите его и сразу увидите результат общего голосования.</p>
  </section>

  <main id="polls" aria-live="polite"></main>
  <p class="status" id="status" role="status"></p>
  <footer class="site-footer"><span>Выберите один вариант в каждом опросе.</span><span>01 - 03</span></footer>

  <script>
    /* Paste the URL that ends with /exec after deploying Code.gs as a Web App. */
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyYyjg2IVhKYNKINUqCgX5BLRPclAtJN93D4UOsAwcM2lDuJ-gtOLKu1hqWuFQzd39P/exec";

    const POLLS = [
      { slug: "grach", title: "Грач", serial: "01", accent: "#ff2828", correct: "A", images: { A: "assets/grach-a.png", B: "assets/grach-b.png" } },
      { slug: "volk", title: "Волк", serial: "02", accent: "#57a52f", correct: "B", images: { A: "assets/volk-a.webp", B: "assets/volk-b.webp" } },
      { slug: "osetr", title: "Осётр", serial: "03", accent: "#00a7c8", correct: "A", images: { A: "assets/osetr-a.png", B: "assets/osetr-b.png" } }
    ];
    const VOTES_KEY = "visual-turing-votes-v1";
    const CLIENT_KEY = "visual-turing-client-id-v1";
    const configured = GOOGLE_SCRIPT_URL.startsWith("https://script.google.com/macros/s/") && !GOOGLE_SCRIPT_URL.includes("PASTE_");
    const localVotes = JSON.parse(localStorage.getItem(VOTES_KEY) || "{}");
    const statsBySlug = {};

    function createUuid() {
      if (crypto.randomUUID) return crypto.randomUUID();
      const bytes = crypto.getRandomValues(new Uint8Array(16));
      bytes[6] = (bytes[6] & 15) | 64; bytes[8] = (bytes[8] & 63) | 128;
      return [...bytes].map((x, i) => (i === 4 || i === 6 || i === 8 || i === 10 ? "-" : "") + x.toString(16).padStart(2, "0")).join("");
    }
    function clientId() {
      let id = localStorage.getItem(CLIENT_KEY);
      if (!id) { id = createUuid(); localStorage.setItem(CLIENT_KEY, id); }
      return id;
    }
    function saveVotes() { localStorage.setItem(VOTES_KEY, JSON.stringify(localVotes)); }
    function setStatus(message) { document.getElementById("status").textContent = message || ""; }
    function percent(value, total) { return total ? Math.round((value / total) * 100) : 0; }
    function escapeHtml(value) { return String(value).replace(/[&<>'"]/g, (ch) => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"})[ch]); }

    function pollMarkup(poll) {
      const answer = localVotes[poll.slug];
      const result = answer ? resultMarkup(poll, answer) : "";
      const unavailable = configured ? "" : "disabled";
      const note = configured ? "" : "Укажите URL опубликованного Google Apps Script в начале файла, затем опубликуйте страницу.";
      return `<section class="poll" id="${poll.slug}" style="--accent:${poll.accent}" data-state="${answer ? "result" : "question"}" aria-labelledby="${poll.slug}-title">
        <div class="poll-inner">
          <div class="poll-heading"><div class="serial">${poll.serial} / Опрос</div><div><h2 id="${poll.slug}-title">${poll.title}</h2><p class="question">Какая из фотографий сгенерирована ИИ?</p></div></div>
          <div class="choices" role="group" aria-label="Выберите вариант для опроса ${poll.title}">
            ${["A", "B"].map((choice) => `<button class="choice" type="button" data-poll="${poll.slug}" data-choice="${choice}" ${unavailable} aria-label="Выбрать вариант ${choice}"><img src="${poll.images[choice]}" alt="Фотография ${choice}, ${poll.title}" loading="lazy"><span class="choice-label"><span>Вариант ${choice}</span><span>Выбрать</span></span></button>`).join("")}
          </div>
          <p class="vote-note">${note}</p>
          <div class="result" data-result-for="${poll.slug}">${result}</div>
        </div>
      </section>`;
    }

    function resultMarkup(poll, choice) {
      const stat = statsBySlug[poll.slug] || { option_a: 0, option_b: 0, total: 0 };
      const isCorrect = choice === poll.correct;
      const a = Number(stat.option_a || 0), b = Number(stat.option_b || 0), total = Number(stat.total || 0);
      const headline = isCorrect
        ? "Верно.<br><strong>Это ИИ.</strong>"
        : "Не совсем.<br><strong>Этот вариант - не ИИ.</strong>";
      const note = isCorrect
        ? "Вы верно определили изображение, созданное ИИ."
        : "Изображение, созданное ИИ, - вариант " + poll.correct + ".";
      return `<div class="result-grid"><div><div class="result-label">Ваш ответ: ${choice}</div><h3 class="result-title">${headline}</h3><p class="result-note">${note}</p></div><div class="stats" aria-label="Результаты голосования"><div class="stat-line"><span>А</span><div class="bar"><i style="width:${percent(a, total)}%"></i></div><span>${percent(a, total)}%</span></div><div class="stat-line"><span>Б</span><div class="bar"><i style="width:${percent(b, total)}%"></i></div><span>${percent(b, total)}%</span></div><p class="stat-total">Всего голосов: ${total}</p></div></div>`;
    }

    function render() {
      document.getElementById("polls").innerHTML = POLLS.map(pollMarkup).join("");
      document.querySelectorAll(".choice").forEach((button) => button.addEventListener("click", () => submitVote(button.dataset.poll, button.dataset.choice)));
    }

    function requestScript(action, params = {}) {
      return new Promise((resolve, reject) => {
        const callback = "__visualQuizJsonp_" + Date.now() + "_" + Math.random().toString(36).slice(2);
        const url = new URL(GOOGLE_SCRIPT_URL);
        url.searchParams.set("action", action);
        url.searchParams.set("callback", callback);
        Object.entries(params).forEach(([key, value]) => url.searchParams.set(key, value));
        const script = document.createElement("script");
        const timeout = setTimeout(() => finish(new Error("timeout")), 12000);
        function finish(error, data) {
          clearTimeout(timeout);
          delete window[callback];
          script.remove();
          error ? reject(error) : resolve(data);
        }
        window[callback] = (data) => finish(null, data);
        script.onerror = () => finish(new Error("network"));
        script.src = url.toString();
        document.head.appendChild(script);
      });
    }

    function updateStats(stats) {
      for (const poll of POLLS) {
        statsBySlug[poll.slug] = stats[poll.slug] || { option_a: 0, option_b: 0, total: 0 };
      }
    }

    function reconcileVotes(serverVotes) {
      let changed = false;
      for (const poll of POLLS) {
        const savedChoice = serverVotes[poll.slug];
        if (savedChoice === "A" || savedChoice === "B") {
          if (localVotes[poll.slug] !== savedChoice) { localVotes[poll.slug] = savedChoice; changed = true; }
        } else if (localVotes[poll.slug]) {
          delete localVotes[poll.slug];
          changed = true;
        }
      }
      if (changed) saveVotes();
    }

    async function loadStats() {
      const statsData = await requestScript("stats");
      if (!statsData || !statsData.ok) throw new Error("stats");
      updateStats(statsData.stats || {});
      const statusData = await requestScript("status", { client_id: clientId() }).catch(() => null);
      if (statusData && statusData.ok) reconcileVotes(statusData.votes || {});
    }

    async function submitVote(slug, choice) {
      const poll = POLLS.find((item) => item.slug === slug);
      if (!poll || localVotes[slug]) return;
      setStatus("");
      document.querySelectorAll(`button[data-poll="${slug}"]`).forEach((button) => button.disabled = true);
      let data;
      try {
        data = await requestScript("vote", { poll: slug, choice, client_id: clientId() });
      } catch (error) {
        document.querySelectorAll(`button[data-poll="${slug}"]`).forEach((button) => button.disabled = false);
        setStatus("Не удалось записать голос. Проверьте подключение к интернету и настройки Google Apps Script.");
        return;
      }
      if (!data || !data.ok) {
        document.querySelectorAll(`button[data-poll="${slug}"]`).forEach((button) => button.disabled = false);
        setStatus("Не удалось записать голос. Попробуйте еще раз.");
        return;
      }
      if (data.stats) updateStats(data.stats);
      if (!data.accepted) {
        if (data.previous_choice === "A" || data.previous_choice === "B") {
          localVotes[slug] = data.previous_choice;
          saveVotes();
        }
        setStatus("Этот браузер уже проголосовал в данном опросе. Показана актуальная статистика.");
        render();
        return;
      }
      localVotes[slug] = choice;
      saveVotes();
      render();
      document.getElementById(slug).scrollIntoView({ behavior: "smooth", block: "start" });
    }

    async function start() {
      render();
      if (!configured) return;
      try { await loadStats(); render(); }
      catch (error) { setStatus("Не удалось загрузить статистику. Проверьте URL опубликованного Google Apps Script."); }
    }
    start();
  </script>
</body>
</html>
